<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Risk Hunt · Cryptika</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
/* Design read: multiplayer card-table game for a consulting team, classic Windows-Solitaire language
   (green felt, physical cards, deal / flip / win-cascade), Cryptika plum card backs.
   Dials: VARIANCE 5 · MOTION 7 · DENSITY 5. Native CSS 3D only, no libraries.
   Shape rule: cards 9px, buttons 10px, chips pill. */
:root{
  --felt:#0E5A3A; --felt-2:#0A4A2F; --felt-3:#083D27; --rail:#3B2416;
  --card:#FBF7EE; --card-edge:#E4DCCB; --ink:#1B1712; --ink-2:#4F473D; --muted:#8B8276;
  --plum:#340456; --plum-2:#4D1777; --gold:#D8B46A; --cream:#F4EEE3;
  --full:#340456; --partial:#B7852E; --neutral:#5F8A6B; --deflect:#6E6A66; --threat:#C2412F;
  --cw:clamp(70px,13vh,110px); --ch:calc(var(--cw) * 1.4); --r:9px;
  --font:"Segoe UI","IBM Plex Sans Arabic",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{font-family:var(--font);color:var(--cream);font-size:15px;line-height:1.6;overflow:hidden;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 90% at 50% 30%, var(--felt) 0%, var(--felt-2) 55%, var(--felt-3) 100%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:overlay;
  background-image:repeating-radial-gradient(circle at 17% 23%, rgba(255,255,255,.08) 0 1px, transparent 1px 3px),repeating-radial-gradient(circle at 71% 64%, rgba(0,0,0,.18) 0 1px, transparent 1px 4px)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono)}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* ---------- chrome ---------- */
.bar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0));}
.logo{display:flex;flex-direction:column;line-height:1.05}
.logo b{letter-spacing:.32em;font-size:11px;color:var(--gold)}
.logo span{font-size:15px;font-weight:700}
.bar .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:12.5px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:10px 18px;font-weight:700;transition:transform .15s var(--ease),filter .2s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-gold{background:var(--gold);color:#2A1D07}
.btn-plum{background:var(--plum);color:var(--cream);box-shadow:0 0 0 1px rgba(216,180,106,.5) inset}
.btn-ghost{background:rgba(0,0,0,.25);color:var(--cream);border:1px solid rgba(255,255,255,.18)}
.btn:hover:not([disabled]){filter:brightness(1.08)}
.ibtn{height:34px;min-width:34px;padding:0 10px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.25);font-size:13px}
.ibtn[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:#7a7a7a}.dot.on{background:#7BE08F}

/* ---------- the card ---------- */
.card{width:var(--cw);height:var(--ch);position:relative;transform-style:preserve-3d;border-radius:var(--r);flex:none;transition:transform .55s var(--ease)}
.card .f,.card .b{position:absolute;inset:0;border-radius:var(--r);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.card .f{background:var(--card);color:var(--ink);padding:8px 9px;display:flex;flex-direction:column;gap:3px;
  box-shadow:0 0 0 1px var(--card-edge) inset,0 1px 0 #fff inset,0 2px 1px rgba(0,0,0,.25),0 10px 18px -6px rgba(0,0,0,.55)}
.card .b{transform:rotateY(180deg);box-shadow:0 2px 1px rgba(0,0,0,.25),0 10px 18px -6px rgba(0,0,0,.55);
  background:radial-gradient(circle at 50% 50%, rgba(216,180,106,.35) 0 14%, transparent 15%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 6px, transparent 6px 12px),
    repeating-linear-gradient(-45deg, rgba(0,0,0,.18) 0 6px, transparent 6px 12px), var(--plum);
  border:5px solid var(--card)}
.card .b::after{content:"C";position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:var(--gold);font-size:22px;letter-spacing:0}
.card.down{transform:rotateY(180deg)}
.card.down .f{visibility:hidden}   /* never rely on backface culling alone: some GPUs show the mirrored face */
.card .id{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.card .t{overflow-wrap:anywhere;font-weight:700;font-size:12.5px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.card .s{font-size:11px;color:var(--ink-2);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.card .band{height:6px;border-radius:3px;margin:-2px 0 3px}
.card .corner{position:absolute;bottom:6px;left:8px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.card.pickable{cursor:pointer}
.card.pickable:hover{transform:translateY(-10px) rotateX(8deg)}
.card.chosen .f{box-shadow:0 0 0 3px var(--gold) inset,0 14px 24px -6px rgba(0,0,0,.6)}
.card.ghost .f{opacity:.55}
.slot{width:var(--cw);height:var(--ch);border-radius:var(--r);border:2px dashed rgba(255,255,255,.22);display:grid;place-items:center;font-size:11px;color:rgba(255,255,255,.5);text-align:center;padding:6px;flex:none}
.deal{animation:deal .6s var(--ease) backwards;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes deal{from{opacity:0;transform:translate(var(--fx,-240px),var(--fy,-160px)) rotate(-24deg) scale(.85)}}
.flipin{animation:flipin .9s var(--ease) both}
@keyframes flipin{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.votes{position:absolute;top:-10px;right:-6px;display:flex;gap:2px;z-index:2}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:800;background:var(--gold);color:#2A1D07;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.av.ai{background:var(--cream);color:var(--plum)}

/* ---------- table (3D) ---------- */
.room{position:fixed;inset:52px 0 0 0;display:grid;grid-template-rows:1fr auto}
.stage{perspective:1700px;overflow:hidden;position:relative;display:flex;flex-direction:column;min-height:0}
.felt{position:relative;flex:1;min-height:0;margin:0 2%;transform:rotateX(16deg);transform-origin:50% 100%;transform-style:preserve-3d;
  display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;gap:18px 26px;padding:14px 18px 10px}
.zone-label{font-size:11px;letter-spacing:.12em;color:rgba(255,255,255,.55);margin-bottom:6px;text-transform:uppercase}
.clues{grid-column:1 / 3;display:flex;gap:10px;align-items:flex-start}
.status{grid-column:3;grid-row:1;display:flex;gap:18px;align-items:flex-start;justify-content:flex-end}
.chips{display:flex;gap:6px}
.chip3d{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 45%, #E05B47 0 38%, #A93323 40% 100%);
  box-shadow:0 0 0 3px #F3E3D8 inset,0 0 0 6px #A93323 inset,0 4px 0 #6e1e14,0 8px 12px rgba(0,0,0,.45);transition:transform .5s var(--ease),opacity .5s}
.chip3d.gone{opacity:.12;transform:translateY(-12px) scale(.8);filter:grayscale(1)}
.rounds{display:flex;gap:4px}
.rounds i{width:16px;height:22px;border-radius:4px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25)}
.rounds i.on{background:var(--cream)}
.rounds i.now{background:var(--gold);box-shadow:0 0 12px rgba(216,180,106,.8)}
.tableau{grid-column:1 / 3;grid-row:2;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;min-height:0}
.col{display:flex;flex-direction:column;align-items:center;min-height:0;border-radius:14px;padding:8px 4px;transition:background .3s}
.col.target{background:rgba(216,180,106,.12);box-shadow:0 0 0 2px rgba(216,180,106,.55) inset}
.col.clickable{cursor:pointer}
.col.clickable:hover{background:rgba(255,255,255,.07)}
.head{width:calc(var(--cw) * 1.55);height:auto;min-height:74px;border-radius:12px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.15);padding:8px 10px;display:grid;gap:2px;position:relative;margin-bottom:10px}
.head b{font-size:14px}.head small{font-size:11.5px;opacity:.75}
.head .tok{display:flex;gap:3px;margin-top:2px}
.head .tok i{width:8px;height:8px;border-radius:2px;background:var(--deflect);box-shadow:0 0 0 1px rgba(255,255,255,.4) inset}
.cascade{display:flex;flex-direction:column;align-items:center}
.cascade .card + .card{margin-top:calc(var(--ch) * -0.72)}
.cascade .card .s{display:none}
.cascade .card .t{-webkit-line-clamp:4;font-size:11.5px}
.cascade .card:last-child{margin-bottom:6px}
.found{grid-column:3;grid-row:2;display:flex;flex-direction:column;align-items:center;gap:8px}
.pile{position:relative;width:var(--cw);height:var(--ch)}
.pile .card{position:absolute;top:0;left:0}
.result{font-weight:800;font-size:18px;text-shadow:0 2px 6px rgba(0,0,0,.5)}

/* ---------- hand (flat, nearest to the player) ---------- */
.hand{position:relative;z-index:5;padding:10px 18px 14px;background:linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,0));min-height:120px}
.prompt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.prompt h2{margin:0;font-size:20px}
.prompt .sub{opacity:.75;font-size:13.5px}
.fan{display:flex;justify-content:center;align-items:flex-end;padding:18px 0 4px;min-height:calc(var(--ch) + 30px)}
.fan .card{--cw:clamp(96px,15vh,136px);--ch:calc(var(--cw) * 1.35);margin:0 5px;transform-origin:50% 120%}
.fan .card .t{font-size:13px;-webkit-line-clamp:7}
.hand{max-height:40vh;overflow:auto;transition:max-height .35s var(--ease)}
.hand.min{max-height:62px;min-height:0;overflow:hidden}
.htoggle{position:absolute;top:10px;left:14px;z-index:6}
.fan .card.pickable:hover{transform:translateY(-22px) scale(1.06) !important;z-index:5}
.cats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.cat{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);border-radius:999px;padding:5px 12px;font-size:12.5px}
.cat b{font-family:var(--mono);color:var(--gold)}
.cat[aria-pressed="true"]{background:var(--cream);color:var(--ink)}
.cat[aria-pressed="true"] b{color:var(--plum)}
.stocks{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:6px 0 22px}
.stock{position:relative;width:64px;height:90px;cursor:pointer;transition:transform .2s var(--ease)}
.stock:hover{transform:translateY(-6px)}
.stock .card{--cw:64px;--ch:90px;position:absolute;top:0;left:0}
.stock .lbl{font-family:var(--mono)}
.stock .lbl{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stock.on{outline:2px solid var(--gold);outline-offset:4px;border-radius:9px}
.sug{display:inline-flex;align-items:center;gap:8px;background:rgba(52,4,86,.6);border:1px solid rgba(216,180,106,.5);border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px}
.sug button{border:0;border-radius:999px;background:var(--gold);color:#2A1D07;padding:3px 10px;font-weight:700;font-size:12px}
.decl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.select{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:9px 12px;color:var(--cream);max-width:100%}
.select option{color:#111}
.waiting{display:flex;align-items:center;gap:12px;opacity:.85}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.implemented{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.implemented .card{--cw:clamp(78px,11vh,96px);--ch:calc(var(--cw) * 1.15)}
.ceocols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.minirow{display:flex;gap:8px;flex-wrap:wrap;padding-top:6px}
.minirow .card{--cw:118px;--ch:96px}
.minirow .card .t{font-size:11px;-webkit-line-clamp:4}
.implemented .card .t{font-size:11px;-webkit-line-clamp:4}

/* ---------- announcer ---------- */
.ann{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:45;display:grid;gap:6px;justify-items:center;pointer-events:none;width:min(680px,92vw)}
.ann .m{background:rgba(12,10,8,.82);border:1px solid rgba(216,180,106,.45);border-radius:14px;padding:10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:annIn .45s var(--ease) both;font-size:14px}
.ann .m.ai{border-color:rgba(201,169,232,.6)}
.ann .m b{color:var(--gold)}
@keyframes annIn{from{opacity:0;transform:translateY(-10px) scale(.97)}}

/* ---------- panels / overlays ---------- */
.drawer{position:fixed;top:52px;bottom:0;width:min(360px,92vw);z-index:35;background:rgba(10,24,17,.96);border-left:1px solid rgba(255,255,255,.12);padding:16px;overflow:auto;transform:translateX(-105%);left:0;transition:transform .35s var(--ease)}
.drawer.open{transform:none}
.drawer h3{margin:0 0 10px;font-size:14px;color:var(--gold)}
.ce{display:flex;gap:8px;font-size:12.5px;margin-bottom:7px;line-height:1.5}
.ce i{width:9px;height:9px;border-radius:3px;margin-top:6px;flex:none}
.sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.55);padding:18px}
.sheet .box{background:var(--card);color:var(--ink);border-radius:16px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.sheet h2{margin:0 0 8px}
.sheet table{width:100%;border-collapse:collapse;font-size:14px}
.sheet td{padding:7px 8px;border-bottom:1px solid var(--card-edge);vertical-align:top}
.center{position:fixed;inset:52px 0 0 0;display:grid;place-items:center;padding:20px;overflow:auto}
.panel{background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:22px;backdrop-filter:blur(2px)}
.input{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:11px 13px;width:100%;color:var(--cream)}
.input:focus{outline:none;border-color:var(--gold)}
.code{font-family:var(--mono);font-size:30px;letter-spacing:.35em;text-align:center;direction:ltr;text-transform:uppercase}
.err{color:#FFB4A6;min-height:1.4em;font-size:14px}
.hero-cards{display:flex;justify-content:center;margin:0 0 18px;perspective:900px}
.hero-cards .w{margin:0 -16px;animation:deal .9s var(--ease) backwards}
.hero-cards .card{--cw:118px;--ch:164px}
.seatgrid{display:grid;grid-template-columns:repeat(7,auto);gap:14px;justify-content:center}
.seat{cursor:pointer}
.seat .f{align-items:center;text-align:center;justify-content:center}
.seat.mine .f{box-shadow:0 0 0 3px var(--gold) inset,0 10px 18px -6px rgba(0,0,0,.55)}
.seat.taken{cursor:not-allowed}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;background:var(--card);color:var(--ink);border-radius:999px;padding:10px 18px;font-size:14px;animation:annIn .3s ease both}
#cascade{position:fixed;inset:0;z-index:55;pointer-events:none}
.endbox{position:fixed;inset:0;z-index:58;display:grid;place-items:center;padding:20px;pointer-events:none}
.endbox .panel{pointer-events:auto;max-width:720px;width:100%;background:rgba(10,8,6,.86)}
.endbox h1{margin:0;font-size:clamp(30px,5vw,54px);line-height:1.1}

.card.zoomable{cursor:zoom-in}
.card.fit2 .t{font-size:11.5px}.card.fit3 .t{font-size:10.5px}
.fan .card.fit2 .t,.fan .card.fit3 .t{-webkit-line-clamp:11}
.ov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(3,14,9,.74);backdrop-filter:blur(3px);animation:annIn .35s var(--ease) both}
.ovbox{width:min(880px,100%);max-height:88vh;overflow:auto;background:linear-gradient(180deg,rgba(12,44,29,.97),rgba(6,26,17,.97));border:1px solid rgba(216,180,106,.45);border-radius:20px;padding:24px 26px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.ovbox h1{margin:4px 0 6px;font-size:clamp(26px,3.6vw,40px);line-height:1.2}
.ovbox .lead{margin:0 0 14px;font-size:17px;color:var(--gold)}
.ovcards{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;margin:8px 0 12px}
.ovcards .card{--cw:150px;--ch:206px}
.ovcards .card .t{font-size:14px;-webkit-line-clamp:5}.ovcards .card .s{-webkit-line-clamp:7;font-size:12px}
.note2{opacity:.88;margin:6px 0 16px;line-height:1.7}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sum{width:100%;border-collapse:collapse;margin:10px 0 16px;font-size:14px}
.sum th{width:72px;text-align:start;color:var(--gold);padding:8px;vertical-align:top}
.sum td{padding:8px;border-bottom:1px solid rgba(255,255,255,.1);line-height:1.8}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;color:#fff}
.ov.zoomov{z-index:75;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out}
.zoomov p{opacity:.7;margin-top:14px}
.bigcard .card{--cw:min(380px,88vw);--ch:auto;min-height:240px;max-height:72vh}
.bigcard .card .f{position:relative;inset:auto}
.bigcard .card .f{padding:22px;gap:10px}
.bigcard .card .t{font-size:clamp(17px,2.4vw,22px);display:block;-webkit-line-clamp:unset;overflow:auto}
.bigcard .card .s{font-size:15px;display:block;-webkit-line-clamp:unset}
.bigcard .card .id{font-size:13px}
.hand.mine{box-shadow:inset 0 3px 0 var(--gold)}
.hand.mine .prompt h2{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{color:var(--gold)}}
.goal{max-width:320px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold)}
.slides .dots{display:flex;gap:6px;justify-content:center;margin:6px 0 14px}
.slides .dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}.slides .dots i.on{background:var(--gold)}
.rate{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.roster{position:relative;flex:none;padding:4px 12px 8px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;z-index:3;pointer-events:none}
.rg{display:flex;align-items:center;gap:4px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:4px 8px 4px 12px}
.rt{font-family:var(--mono);font-size:11px;color:var(--gold);font-weight:700;margin-inline-end:4px}
.rp{display:inline-flex;align-items:baseline;gap:5px;font-size:12.5px;padding:2px 8px;border-radius:999px;opacity:.65}
.rp.h{opacity:1;background:rgba(244,238,227,.13)}
.rp small{font-size:10.5px;opacity:.7}
.rp i{font-style:normal;font-size:10.5px;background:var(--gold);color:#2A1D07;border-radius:999px;padding:0 6px;font-weight:700}
.ovbox .roster,.endbox .roster{position:static;justify-content:flex-start;margin:4px 0 12px;pointer-events:auto}
@media (max-width:900px){
  .ceocols{grid-template-columns:1fr}
  .roster{position:static;justify-content:flex-start;padding:0 10px 10px}
  :root{--cw:64px;--ch:90px}
  body{overflow:auto}
  .room{position:static;display:block;padding-top:52px}
  .stage{perspective:none;overflow:visible}

-02","t":"Virtual Patch/WAF/IPS rule مؤقت"},{"id":"CD-03","t":"تعطيل أو عزل المكون الضعيف"},{"id":"CD-04","t":"إعادة الفحص والتحقق"},{"id":"CD-05","t":"Compensating Control مع Exception محدد"},{"id":"CD-06","t":"Asset Discovery لتحديد نطاق التعرض"}]},"CE":{"title":"Change & Configuration","items":[{"id":"CE-01","t":"Rollback للتغيير غير الآمن"},{"id":"CE-02","t":"استعادة Secure Baseline"},{"id":"CE-03","t":"إغلاق Temporary Rule/Exception"},{"id":"CE-04","t":"فرض Approval + SoD"},{"id":"CE-05","t":"تفعيل Configuration Drift Detection"},{"id":"CE-06","t":"مراجعة Emergency Change وإغلاق آثاره"}]},"CF":{"title":"Monitoring & Incident Response","items":[{"id":"CF-01","t":"رفع مستوى Logging"},{"id":"CF-02","t":"تفعيل Alert مخصص"},{"id":"CF-03","t":"إضافة مصدر Logs إلى SIEM"},{"id":"CF-04","t":"Incident Triage وحفظ الأدلة"},{"id":"CF-05","t":"Threat Hunting"},{"id":"CF-06","t":"اختبار Alert routing والتصعيد"}]},"CG":{"title":"Backup & Recovery","items":[{"id":"CG-01","t":"Restore Test فوري"},{"id":"CG-02","t":"Immutable/Offline Backup"},{"id":"CG-03","t":"تصحيح Backup Job ومراقبته"},{"id":"CG-04","t":"اختبار Failover/DR"},{"id":"CG-05","t":"تحديث Runbook والمسؤوليات"},{"id":"CG-06","t":"معالجة فجوة RTO/RPO"}]},"CH":{"title":"Secure Development / Application","items":[{"id":"CH-01","t":"إصلاح الثغرة البرمجية ونشر Fix"},{"id":"CH-02","t":"WAF/API Gateway rule مؤقت"},{"id":"CH-03","t":"إزالة Secret/API Key وتدويره"},{"id":"CH-04","t":"SAST/DAST/SCA وإعادة التحقق"},{"id":"CH-05","t":"تقييد صلاحية النشر وفصل البيئات"},{"id":"CH-06","t":"Security Review قبل Production"}]},"CI":{"title":"Third Party & Dependency","items":[{"id":"CI-01","t":"تقييد/تعليق وصول الطرف الثالث"},{"id":"CI-02","t":"MFA ووقت صلاحية محدد للمورد"},{"id":"CI-03","t":"Corrective Action مع المزود"},{"id":"CI-04","t":"مراقبة وتسجيل جلسات الطرف الثالث"},{"id":"CI-05","t":"تفعيل بديل/خطة خروج"},{"id":"CI-06","t":"تحديث Incident/SLA requirements"}]}},"ev":{"EG-01":"آخر مراجعة لم تظهر استثناءً مفتوحاً.","EG-02":"التغطية مطابقة للـbaseline ضمن نطاق السؤال.","EG-03":"آخر اختبار نجح ولا توجد ملاحظة مرتبطة بالخطر الحالي.","EG-04":"لا يوجد Indicator حديث في هذا المجال.","EG-05":"الدليل صحيح لكنه لا يكفي لتأكيد أو نفي الخطر.","EG-06":"المعلومة تخص Dependency ثانوية وليست Root Cause.","EA-01":"الضابط موجود لكن دليل فعاليته قديم.","EA-02":"يوجد استثناء لكنه لا يثبت وحده أنه سبب الخطر.","EA-03":"التغطية جزئية وتحتاج أدلة أخرى.","EA-04":"ظهرت ملاحظة تشغيلية لكن أثرها غير محسوم."},"hd":{"HD-01":"الخلل مرتبط بصلاحية أقوى من المطلوب.","HD-02":"ابحثوا عن الفرق بين وجود الحساب وصحة الحاجة إليه.","HD-03":"المشكلة أقرب إلى Confidentiality من Availability.","HD-04":"المشكلة أقرب إلى Availability/Recovery.","HD-05":"راجعوا آخر تغيير أو استثناء.","HD-06":"وجود Backup لا يثبت أن الاستعادة ممكنة.","HD-07":"الـLogs قد تكشف السلوك قبل السبب.","HD-08":"فكروا في External Exposure.","HD-09":"المشكلة قد تكون Configuration لا غياب تقنية.","HD-10":"أحد الضوابط موجود لكن التغطية غير كاملة.","HD-11":"فكروا أين توجد نسخة إضافية من البيانات.","HD-12":"راجعوا Secret أو Credential وليس User فقط.","HD-13":"تحقيق Production Change قد يكون أسرع طريق.","HD-14":"اسألوا هل الثغرة قابلة للاستغلال من المسار الحالي.","HD-15":"المشكلة في الحركة الجانبية أكثر من نقطة الدخول.","HD-16":"المشكلة في هوية المستخدم أكثر من الجهاز.","HD-17":"اختبار فعالية الضابط أهم من وجود الوثيقة.","HD-18":"راجعوا صلاحيات المورد/المكون الخارجي."},"hm":{"HM-01":"الاحتواء السريع قد يكون أهم من الحل النهائي الآن.","HM-02":"عالجوا Credential/Privilege قبل إضافة تقنية جديدة.","HM-03":"استعادة الـBaseline قد تخفض الخطر سريعاً.","HM-04":"للبيانات: راجعوا التشفير ونطاق الوصول.","HM-05":"إذا كان الانتشار ممكناً فكروا بالعزل والتقسيم.","HM-06":"لا تعتبروا Backup فعالاً قبل Restore Test.","HM-07":"قد تحتاجون Mitigation مؤقت قبل Patch دائم.","HM-08":"أغلقوا Exposure أولاً.","HM-09":"التغيير غير المصرح قد يحتاج Rollback.","HM-10":"Secret exposed يحتاج Rotation لا الحذف فقط.","HM-11":"MFA لا يعالج حساباً لا يجب أن يكون موجوداً.","HM-12":"اختاروا Control يعالج Root Cause.","HM-13":"اختبروا نجاح الضابط بعد تطبيقه.","HM-14":"استخدموا Compensating Control إذا تعذر الحل الآن.","HM-15":"قارنوا القدرة الفعلية مع RTO/RPO.","HM-16":"للوصول المميز قللوا الصلاحية والمدة معاً.","HM-17":"Logging دون احتواء ليس كافياً.","HM-18":"WAF قد يكون مؤقتاً والإصلاح البرمجي هو الجذر."}}</script>
<script>
/* Risk Hunt rules = the boss's playtest notes, with the corrected win logic.
   - 3 fixed IT roles, 6 risks each. All IT know the owner; only the owner sees its implemented controls.
   - Case file: indicators at the start, then evidence that gets closer every round.
   - Each round (in parallel): GRC questions one role twice (pick 1 of 5 from a chosen jar), the target
     answers truthfully (owner may choose full or partial); IT applies one control from a random draw, never twice.
   - Wins: GRC names owner+risk while the risk is still open -> GRC wins.
           IT brings severity to 0 and GRC never names it by the end -> IT wins.
           IT brings severity to 0 and GRC names it afterwards -> both win (fixed AND documented).
           Time runs out, risk open, not found -> incident, nobody wins.
   - CEO: 8 optional hints, max 2 per round, private to the team that gets them; wins by staying neutral. */
const Engine3 = (() => {
  // ponytail: outcome mix measured by bot simulation (sim3.js); re-run it after any change here
  const RULES = { BOT_CLUE: 1.5, BOT_LAST_GUESS: 0.35, DECLARES: 2, BOT_SHARP: 0.4, TRACE_LAST: false, OWNER_FULL: 0.2, BOT_IT_SKILL: 0.85, ROUNDS: 4, START_SEV: 4, CEO_HINTS: 8, CEO_PER_ROUND: 2, CEO_WIN_SCORE: 95, Q_OFFER: 5, C_OFFER: 4, IMPLEMENTED: 4, QUESTIONS_PER_ROUND: 2 };
  const ROLES = [
    { id: 'INF', name: 'Infrastructure', ar: 'البنية التحتية', fns: ['IT-02', 'IT-03'] },
    { id: 'APP', name: 'Core Application', ar: 'التطبيقات الأساسية', fns: ['IT-04', 'IT-05'] },
    { id: 'DB', name: 'Database', ar: 'قواعد البيانات', fns: ['IT-01', 'IT-06'] },
  ];
  let D = null, HD_FREQ = {};
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const roleOfFn = (fn) => ROLES.find((r) => r.fns.includes(fn)).id;
  const risk = (st) => D.risks.find((r) => r.id === st.riskId);
  const catOf = (id) => id.slice(0, 2);
  const allControls = () => Object.keys(D.c).flatMap((p) => D.c[p].items.map((c) => c.id));
  const rate = (r, cid) => (r.strong.includes(cid) ? 2 : r.partial.includes(cid) ? 1 : 0);
  function poolEV(r, pool) { const ids = D.c[pool].items.map((c) => c.id); return ids.reduce((s, id) => s + rate(r, id), 0); }

  function init(data) {
    D = data; HD_FREQ = {};
    for (const r of D.risks) {
      r.role = roleOfFn(r.owner);
      r.secRoles = [...new Set(r.secondary.map(roleOfFn))].filter((x) => x !== r.role);
      r.hd.forEach((h) => (HD_FREQ[h] = (HD_FREQ[h] || 0) + 1));
      const pools = Object.keys(D.c).sort((a, b) => poolEV(r, b) - poolEV(r, a));
      r.bestPool = pools[0]; r.worstPool = pools[pools.length - 1];
    }
  }

  function newGame(riskId) {
    const r = riskId ? D.risks.find((x) => x.id === riskId) : pick(D.risks);
    const fixes = new Set([...r.strong, ...r.partial]);
    const implemented = {};
    for (const role of ROLES) implemented[role.id] = shuffle(allControls().filter((c) => !fixes.has(c))).slice(0, RULES.IMPLEMENTED);
    // evidence ladder: vague indicators first, closer every round, a direct trace last
    const ladder = [...r.hd.slice().sort((a, b) => HD_FREQ[b] - HD_FREQ[a]).map((id) => ({ kind: 'hd', id })), { kind: 'cat', id: r.qcats[0] }, ...(RULES.TRACE_LAST ? [{ kind: 'ev', id: r.evidence[r.evidence.length - 1] }] : r.qcats.slice(1, 2).map((id) => ({ kind: 'cat', id })))];
    const clues = [ladder.slice(0, 2), ladder.slice(2, 3), ladder.slice(3, 4), ladder.slice(4, 5)];
    return {
      riskId: r.id, sev: RULES.START_SEV, round: 1, applied: [], implemented, clues,
      ceoLeft: RULES.CEO_HINTS, ceoRound: 0, hints: [], answers: [], asked: [], declares: [],
      lockRound: null, fixed: false, fixedRound: null, done: null, decidedRound: null,
    };
  }
  function clueText(c) {
    if (!c) return null;
    if (c.kind === 'hd') return D.hd[c.id];
    if (c.kind === 'ev') return `أثر مباشر: ${c.id}`;
    return `جذر المشكلة مرتبط بمجال ${D.q[c.id].title}.`;
  }
  const cluesSoFar = (st) => st.clues.slice(0, st.fixed ? st.fixedRound : st.round).flat();

  function questionOffers(st) {
    const out = {};
    for (const cat of Object.keys(D.q)) out[cat] = shuffle(D.q[cat].items.map((q) => q.id).filter((id) => !st.asked.includes(id))).slice(0, RULES.Q_OFFER);
    return out;
  }
  function controlOffers(st) {
    const r = risk(st); const blocked = new Set([...st.applied, ...st.implemented[r.role]]);
    const out = {};
    for (const pool of Object.keys(D.c)) out[pool] = shuffle(D.c[pool].items.map((c) => c.id).filter((id) => !blocked.has(id))).slice(0, RULES.C_OFFER);
    return out;
  }

  /* answer cards a target can truthfully play */
  function answerOptions(st, role, qid) {
    const r = risk(st), cat = catOf(qid), owner = role === r.role, related = r.qcats.includes(cat);
    const ea = D.ev[['EA-01', 'EA-02', 'EA-03', 'EA-04'][(qid.charCodeAt(1) + +qid.slice(-1)) % 4]];
    const ctl = st.implemented[role][+qid.slice(-1) % RULES.IMPLEMENTED];
    const opts = [];
    if (owner && r.directq.includes(qid)) {
      const k = r.directq.indexOf(qid) % r.evidence.length;
      opts.push({ type: 'full', text: r.evidence[k] }, { type: 'partial', text: ea });
    } else if ((owner || r.secRoles.includes(role)) && related) opts.push({ type: 'partial', text: ea });
    else opts.push({ type: 'neutral', text: `${D.ev['EG-0' + (1 + (+qid.slice(-1) % 6))]} لدينا: ${ctlText(ctl)}.` });
    return opts;
  }
  const ctlText = (id) => D.c[id.slice(0, 2)].items.find((c) => c.id === id).t;
  function answer(st, role, qid, type) {
    const o = answerOptions(st, role, qid).find((x) => x.type === type) || answerOptions(st, role, qid)[0];
    st.asked.push(qid);
    const a = { round: st.round, role, qid, type: o.type, text: o.text }; st.answers.push(a); return a;
  }
  function applyControl(st, cid) {
    const delta = rate(risk(st), cid), before = st.sev;
    st.sev = Math.max(0, st.sev - delta); st.applied.push(cid);
    return { cid, delta, before, after: st.sev, label: delta === 2 ? 'Strong' : delta === 1 ? 'Partial' : 'No Match' };
  }

  /* CEO hint pool: generated from the case file so every hint is true */
  function ceoHints(st, team) {
    const r = risk(st); const used = new Set(st.hints.map((h) => h.id)); const clueIds = new Set(st.clues.filter(Boolean).map((c) => c.id));
    const list = team === 'grc'
      ? [...r.hd.filter((h) => !clueIds.has(h)).map((id) => ({ id, text: D.hd[id] })),
         ...r.qcats.slice(0, 2).map((c) => ({ id: 'CAT-' + c, text: `أسئلة ${D.q[c].title} رح تكشف أكثر.` }))]
      : [...r.hm.map((id) => ({ id, text: D.hm[id] })),
         { id: 'POOL-' + r.bestPool, text: `أقوى معالجة موجودة بفئة ${D.c[r.bestPool].title}.` },
         { id: 'AVOID-' + r.worstPool, text: `فئة ${D.c[r.worstPool].title} ما رح تفيد بهالخطر.` }];
    return list.filter((h) => !used.has(h.id));

    parts.push(`<div class="rate"><span class="sub">قرار القائد ${esc(displayName(g.rate.leader))} الأخير:</span><button class="btn btn-ghost" data-rate="1">موفق</button><button class="btn btn-ghost" data-rate="-1">مش موفق</button></div>`);

/* the classic Solitaire win: bouncing cards that leave trails */
let cascadeRAF = 0;
function stopCascade() { cancelAnimationFrame(cascadeRAF); const c = $('#cascade'); c.classList.add('hidden'); }
function cascade(outcome) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#cascade'); c.classList.remove('hidden'); c.width = innerWidth; c.height = innerHeight; const x = c.getContext('2d');
  const W = 70, H = 98; const label = outcome === 'grc' ? 'GRC' : outcome === 'it' ? 'IT' : '!';
  const face = document.createElement('canvas'); face.width = W; face.height = H; const f = face.getContext('2d');
  f.fillStyle = '#FBF7EE'; f.beginPath(); f.roundRect(0, 0, W, H, 8); f.fill(); f.strokeStyle = '#340456'; f.lineWidth = 3; f.stroke();
  f.fillStyle = '#340456'; f.font = '800 20px Segoe UI, sans-serif'; f.textAlign = 'center'; f.fillText(label, W / 2, H / 2 + 7);
  const cards = []; let spawned = 0, t0 = performance.now();
  const step = (now) => {
    if (spawned < 26 && now - t0 > spawned * 260) { cards.push({ x: innerWidth * (0.15 + Math.random() * 0.7), y: 80, vx: (Math.random() < 0.5 ? -1 : 1) * (2 + Math.random() * 4), vy: -Math.random() * 6 }); spawned++; }
    for (const k of cards) { k.vy += 0.45; k.x += k.vx; k.y += k.vy; if (k.y + H > c.height) { k.y = c.height - H; k.vy *= -0.78; } x.drawImage(face, k.x, k.y); }
    if (now - t0 < 14000) cascadeRAF = requestAnimationFrame(step); else stopCascade();
  };
  cascadeRAF = requestAnimationFrame(step);
}

    SND.ctx = SND.ctx || new (window.AudioContext || window.webkitAudioContext)(); const c = SND.ctx, t0 = c.currentTime;
    const tone = (f, d, type = 'sine', gain = 0.07, at = 0) => { const o = c.createOscillator(), v = c.createGain(); o.type = type; o.frequency.value = f; v.gain.setValueAtTime(gain, t0 + at); v.gain.exponentialRampToValueAtTime(0.0001, t0 + at + d); o.connect(v).connect(c.destination); o.start(t0 + at); o.stop(t0 + at + d + 0.02); };
    ({ card: () => tone(880, 0.05, 'triangle', 0.05), flip: () => { tone(520, 0.05, 'triangle', 0.05); tone(780, 0.07, 'triangle', 0.04, 0.05); },
       chip: () => { tone(240, 0.12, 'square', 0.035); tone(180, 0.14, 'square', 0.03, 0.08); }, turn: () => { tone(660, 0.12); tone(990, 0.18, 'sine', 0.07, 0.12); },
       win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.26, 'triangle', 0.06, i * 0.12)), bad: () => tone(150, 0.4, 'sawtooth', 0.035) })[kind]?.();
  } catch {}
}
function sfx(e, d) {
  const k = e.k;
  if (k === 'round' || k === 'start') beep('flip');
  else if (k === 'answer' || k === 'ask' || k === 'target') beep('card');
  else if (k === 'control') beep('chip');
  else if (k === 'declare') beep(d && d.ok ? 'win' : 'bad');
  else if (k === 'revote') beep('bad');
  else if (k === 'fixed' || k === 'leader') beep('win');
  else if (k === 'end') beep(d && d.outcome === 'incident' ? 'bad' : 'win');
}
function turnCue() {
  const g = ST && ST.game, seat = mySeat(), team = myTeam();
  const mine = g && seat && g.step !== 'end' ? g.pending.filter((p) => (p.seat ? p.seat === seat : p.team === team) && !UI.myVote[p.id]) : [];
  const key = mine.map((p) => p.id).join();
  if (key && key !== UI.turnKey) { beep('turn'); if (UI.handMin) { UI.handMin = false; const hh = $('.hand'); if (hh) hh.classList.remove('min'); const b = $('#hTog'); if (b) b.textContent = 'صغّر يدك'; } }
  UI.turnKey = key; document.title = key ? '● دورك · Risk Hunt' : 'Risk Hunt · Cryptika';
  const h = $('.hand'); if (h) h.classList.toggle('mine', !!key);
}
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('#overlay').innerHTML = ''; UI.panel = null; UI.zoom = null; renderZoom(); renderBar(); renderDrawer(); } });
Object.assign(UI, { closed: {}, zoom: null, turnKey: '' });

(function boot() {
  const code = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
