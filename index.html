<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cyber GRC Risk Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
/* Design read: shared game table for a small team, milk / off-white, minimal and typographic.
   Brand accent plum #340456 used sparingly. Shape rule: cards 16px, buttons 10px, chips pill.
   Icons: lucide UMD (the host's CSP only allows scripts, so icon fonts/stylesheets can't load). */
:root{
  --milk:#F7F3EA; --paper:#FFFDF8; --paper-2:#FBF8F1; --line:#E7E0D2; --line-2:#D9D0BF;
  --ink:#1C1814; --ink-2:#4B443B; --muted:#8C8377;
  --plum:#340456; --plum-2:#4A1473; --plum-soft:#F1EAF6;
  --direct:#340456; --amber:#B7852E; --neutral:#7A937E; --danger:#B5483A;
  --r-card:16px; --r-btn:10px;
  --font:"Segoe UI","IBM Plex Sans Arabic",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--milk);color:var(--ink);font-family:var(--font);font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--mono)}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
svg.lucide{width:18px;height:18px;stroke-width:1.75;vertical-align:-3px;flex:none}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:var(--r-btn);padding:10px 18px;font-weight:600;white-space:nowrap;background:transparent;transition:transform .15s var(--ease),background .2s,border-color .2s}
.btn:active{transform:translateY(1px) scale(.98)}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn-primary{background:var(--plum);color:#FBF7EF}
.btn-primary:hover:not([disabled]){background:var(--plum-2)}
.btn-ink{background:var(--ink);color:var(--milk)}
.btn-line{border-color:var(--line-2);color:var(--ink)}
.btn-line:hover{border-color:var(--ink-2)}
.icon-btn{height:36px;min-width:36px;padding:0 10px;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--paper);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--ink-2)}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn[aria-pressed="true"]{background:var(--ink);color:var(--milk);border-color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--ink-2);background:var(--paper)}
.note{font-size:13px;color:var(--muted)}

/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:10px 20px;background:rgba(247,243,234,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{letter-spacing:.3em;font-size:11.5px}
.brand span{font-size:11.5px;color:var(--muted)}
.meter{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.meter .n{font-family:var(--mono);font-size:17px;font-weight:600;color:var(--ink)}
.bars{display:flex;gap:3px}
.bars i{width:12px;height:6px;border-radius:2px;background:var(--line)}
.bars.sev i.on{background:var(--danger)} .bars.clk i.on{background:var(--ink)}
.top .grow{flex:1}
.status{font-size:12.5px;border-radius:999px;padding:4px 12px;border:1px solid var(--line);color:var(--muted)}
.status.ok{background:var(--plum);color:#FBF7EF;border-color:var(--plum)}
.net{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.net.on{background:#5E9B6C}

/* stage */
.wrap{max-width:1040px;margin:0 auto;padding:30px 24px 80px}
.steps{display:flex;gap:4px;margin-bottom:10px}
.steps span{font-family:var(--mono);font-size:11px;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--muted);border:1px solid var(--line)}
.steps span.done{color:var(--ink-2);border-color:var(--line-2)}
.steps span.now{background:var(--ink);color:var(--milk);border-color:var(--ink)}
.title{font-size:clamp(26px,3.2vw,40px);font-weight:700;line-height:1.2;margin:0}
.who{display:flex;align-items:center;gap:10px;margin:8px 0 22px;font-size:14px;color:var(--ink-2);flex-wrap:wrap}
.tag{font-family:var(--mono);font-size:11px;border-radius:999px;padding:2px 9px;border:1px solid var(--line-2)}
.tag.you{background:var(--plum);color:#FBF7EF;border-color:var(--plum)}
.tag.ai{background:var(--plum-soft);color:var(--plum);border-color:transparent}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);padding:22px}
.card + .card{margin-top:14px}
.card h3{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:600}
.enter{animation:enter .4s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pick{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:start;display:grid;gap:3px;transition:border-color .2s,transform .2s var(--ease)}
.pick:hover{border-color:var(--ink-2);transform:translateY(-1px)}
.pick[aria-pressed="true"]{background:var(--ink);color:var(--milk);border-color:var(--ink)}
.pick .id{font-family:var(--mono);font-size:11.5px;opacity:.6}
.pick .nm{font-weight:700;line-height:1.35}
.pick .sc{font-size:12.5px;opacity:.7;line-height:1.5}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper-2);border-radius:999px;padding:7px 14px;font-size:14px}
.cat b{font-family:var(--mono);font-weight:600}
.cat:hover{border-color:var(--ink-2)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--milk);border-color:var(--ink)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.bar .sp{flex:1}
.sug{display:flex;gap:12px;align-items:center;background:var(--plum-soft);border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.sug .t{flex:1}
.sug b{font-family:var(--mono)}
.divider{height:1px;background:var(--line);margin:18px 0}
.qrow{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;margin-bottom:10px}
.q{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.q .id{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.q p{margin:3px 0 0;font-weight:600}
.ev{border-radius:14px;padding:12px 14px;color:#FFFDF8;display:flex;flex-direction:column;justify-content:center}
.ev .k{font-family:var(--mono);font-size:11px;opacity:.85}
.ev p{margin:2px 0 0;font-weight:600;font-size:14px}
.ev.direct{background:var(--direct)} .ev.amber{background:var(--amber)} .ev.neutral{background:var(--neutral)}
.ev.pending{background:var(--line);color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:6px;background:var(--c)}
.ctls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctl{background:var(--paper-2);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:start;display:grid;gap:5px;min-height:110px}
.ctl:hover{border-color:var(--ink-2)}
.ctl[aria-pressed="true"]{border-color:var(--plum);box-shadow:inset 0 0 0 1.5px var(--plum)}
.ctl .id{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ctl .nm{font-weight:700;font-size:16px}
.preview{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 16px;font-size:13px;color:var(--ink-2)}
.preview b{font-family:var(--mono);font-weight:600;margin-inline-end:6px}
.hints{display:grid;gap:8px}
.hint{display:flex;gap:12px;align-items:center;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:start}
.hint:hover{border-color:var(--ink-2)}
.hint .id{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:48px}
.hint .used{margin-inline-start:auto;font-size:11.5px;color:var(--muted)}
.select{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r-btn);padding:10px 12px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--muted)}
.input{background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-btn);padding:10px 12px;width:100%}
.input:focus{outline:none;border-color:var(--ink-2)}

/* waiting */
.wait{display:flex;align-items:center;gap:18px;padding:8px 0}
.dots{display:inline-flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ink-2);animation:dot 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:none}}
.timer{font-family:var(--mono);font-size:13px;color:var(--muted)}
.timer.hot{color:var(--danger)}
.round-board{margin-top:26px}
.round-board h4{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:600}
.mini{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 12px;font-size:13px;background:var(--paper);border:1px solid var(--line)}
.pill i.sw{width:9px;height:9px;border-radius:3px;display:inline-block}

/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.seatgrp{margin-bottom:18px}
.seatgrp h4{margin:0 0 8px;font-size:12.5px;color:var(--muted);font-weight:600}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.seat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:start;display:grid;gap:6px;min-height:92px;transition:border-color .2s,background .2s}
.seat:hover:not([disabled]){border-color:var(--ink-2)}
.seat[disabled]{cursor:default}
.seat .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.seat .nm{font-weight:600;font-size:13.5px;line-height:1.35}
.occ{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.seat.taken{background:var(--paper-2)}
.seat.mine{background:var(--plum);color:#FBF7EF;border-color:var(--plum)}
.seat.mine .id,.seat.mine .occ{color:#E6D9F0}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;background:var(--ink);color:var(--milk);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.av.ai{background:var(--plum-soft);color:var(--plum)}
.off{opacity:.45}
.people{display:grid;gap:8px}
.person{display:flex;align-items:center;gap:10px;font-size:14px}
.person .s{margin-inline-start:auto;font-size:12px;color:var(--muted)}
.hero{margin-bottom:26px}
.hero p{max-width:60ch;color:var(--ink-2);margin:8px 0 0}

/* drawers */
.drawer{position:fixed;top:57px;bottom:0;width:min(340px,90vw);background:var(--paper);border-color:var(--line);border-style:solid;border-width:0;z-index:25;padding:18px;overflow:auto;transition:transform .35s var(--ease);box-shadow:0 10px 40px rgba(28,24,20,.08)}
.drawer.r{right:0;border-left-width:1px;transform:translateX(105%)}
.drawer.l{left:0;border-right-width:1px;transform:translateX(-105%)}
.drawer.open{transform:none}
.drawer h4{margin:0 0 12px;font-size:13px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.log{display:grid;gap:8px}
.le{font-size:13px;line-height:1.55;border-inline-start:2px solid var(--line);padding-inline-start:10px}
.le .m{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.le.secret{border-color:var(--plum)}
.case-r{margin-bottom:14px}
.case-r .rt{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px}
.case-e{display:flex;gap:8px;font-size:12.5px;margin-bottom:6px}
.case-e i{width:9px;height:9px;border-radius:3px;margin-top:6px;flex:none}
.riskcard{background:var(--milk);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px}
.riskcard .rid{font-family:var(--mono);font-size:11px;background:var(--plum);color:#FBF7EF;border-radius:6px;padding:2px 8px;justify-self:start}
.riskcard h3{margin:0;font-size:19px;line-height:1.3;color:var(--ink)}
.riskcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.riskcard dt{color:var(--muted)} .riskcard dd{margin:0;font-weight:600}
.owner{background:var(--plum-soft);color:var(--plum);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;justify-self:start}

/* spotlight: full-screen announcement of every move */
.spot{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px;text-align:center;cursor:pointer;animation:spotIn .35s var(--ease) both;backdrop-filter:blur(4px)}
.spot.ai{background:rgba(52,4,86,.9);color:#FBF7EF}
.spot.human{background:rgba(28,24,20,.88);color:#FBF7EF}
.spot.gm{background:rgba(247,243,234,.96);color:var(--ink)}
.spot.good{background:rgba(52,4,86,.94);color:#FBF7EF}
.spot.bad{background:rgba(111,33,24,.9);color:#FBF7EF}
@keyframes spotIn{from{opacity:0}to{opacity:1}}
.spot .in{max-width:900px;animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.spot .who{justify-content:center;color:inherit;opacity:.85;margin:0 0 14px}
.spot .who .tag{border-color:currentColor}
.spot .big{font-size:clamp(30px,5.4vw,64px);font-weight:700;line-height:1.15;margin:0}
.spot .sub{font-size:clamp(15px,1.8vw,20px);opacity:.8;margin:14px 0 0}
.spot .xtra{margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.spot .xtra .ev{min-width:170px;text-align:start;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.spot .flow{font-family:var(--mono);font-size:clamp(34px,6vw,72px);font-weight:600;display:flex;gap:18px;align-items:center;justify-content:center}
.spot .prog{position:fixed;bottom:0;right:0;height:3px;background:currentColor;opacity:.5;animation:prog linear both}
@keyframes prog{from{width:100%}to{width:0}}
.spot .skip{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.6}

.home{max-width:760px;margin:0 auto}
.home .kicker{letter-spacing:.3em;font-size:12px;font-weight:700;color:var(--plum);margin-bottom:6px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.home .card + .home-grid .card{margin-top:0}
.code-input{font-family:var(--mono);font-size:30px;letter-spacing:.35em;text-align:center;direction:ltr;text-transform:uppercase;padding:14px}
.err{color:var(--danger);font-size:14px;min-height:1.4em}
.room .code{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:.25em;direction:ltr;text-align:center;color:var(--plum);line-height:1.2}
.aibox{margin-top:10px;padding:12px;border:1px dashed var(--line-2);border-radius:14px;display:grid;gap:8px}
#banner .banner{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--milk);border-radius:999px;padding:8px 16px;font-size:13.5px;display:flex;gap:10px;align-items:center}
#banner .dots i{background:var(--milk)}
.modal{position:fixed;inset:0;z-index:70;background:rgba(28,24,20,.45);display:grid;place-items:center;padding:20px}
.modal .box{background:var(--paper);border-radius:18px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:26px}
.modal table{width:100%;border-collapse:collapse;font-size:14px}
.modal td,.modal th{padding:8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--milk);border-radius:999px;padding:10px 18px;font-size:14px;animation:spotIn .25s ease both}

.end h1{font-size:clamp(36px,6vw,72px);line-height:1.05;margin:4px 0 12px}
.end .en{font-family:var(--mono);color:var(--plum);font-size:13px}
.tl{display:grid;grid-template-columns:80px 1fr 1fr 90px;gap:12px;border-top:1px solid var(--line);padding:12px 0;font-size:13.5px}
.tl .r{font-family:var(--mono);color:var(--muted)}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;vertical-align:middle}

@media (max-width:860px){
  .lobby,.qrow,.ctls,.row2,.tl,.home-grid{grid-template-columns:1fr}
  .top{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .brand span,.meter .lbl{display:none}
  .wrap{padding:20px 14px 60px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pick .sc{display:none}
  .drawer{top:0}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main class="wrap" id="main"></main>
<aside class="drawer r" id="panelTable" aria-label="الطاولة"></aside>
<aside class="drawer l" id="panelLog" aria-label="ملف القضية والسجل"></aside>

<script>
/* Cyber GRC Risk Game: engine + built-in bots.
   Implements the ORIGINAL facilitator manual rules (sections 5, 6, 7, 15, 16, 18).
   Pure logic, no DOM, so it can be unit-tested in node. */
const Engine = (() => {
  let D = null;
  const rnd = (n) => Math.floor(Math.random() * n);
  const pick = (a) => a[rnd(a.length)];
  const shuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = rnd(i + 1); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const catOf = (id) => id.slice(0, 2);
  const riskById = (id) => D.risks.find((r) => r.id === id);
  const hashIdx = (s, n) => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % n; };

  function init(data) { D = data; }

  function newGame(riskId) {
    const risk = riskId ? riskById(riskId) : pick(D.risks);
    return {
      risk, severity: 4, clock: 4, round: 1,
      discovered: false, discoveredRound: null,
      guessBlockedRound: null,          // "Wrong Owner = no guess next round"
      tokens: { deepDive: true, redraw: true },
      usedHD: [], usedHM: [],
      knowledge: { evidence: [], hints: [], guesses: [] }, // everything GRC is allowed to know
      rounds: [], over: false, outcome: null,
    };
  }

  function drawQuestions(cat, n, exclude = []) {
    const pool = D.q[cat].items.map((q) => q.id).filter((id) => !exclude.includes(id));
    return shuffle(pool).slice(0, n);
  }
  function drawControls(pool, n, exclude = []) {
    const ids = D.c[pool].items.map((c) => c.id).filter((id) => !exclude.includes(id));
    return shuffle(ids).slice(0, n);
  }

  // Manual section 6 + section 15 decision table
  function evidenceFor(risk, target, qid) {
    const cat = catOf(qid);
    const relatedCat = risk.qcats.includes(cat);
    const EA = ['EA-01', 'EA-02', 'EA-03', 'EA-04'];
    const EG = ['EG-01', 'EG-02', 'EG-03', 'EG-04', 'EG-05', 'EG-06'];
    if (target === risk.owner) {
      const di = risk.directq.indexOf(qid);
      if (di >= 0) {
        const k = di % risk.evidence.length;
        return { kind: 'direct', code: `E-${risk.id}-${k + 1}`, text: risk.evidence[k] };
      }
      if (relatedCat) { const c = EA[hashIdx(qid + target, 4)]; return { kind: 'amber', code: c, text: D.ev[c] }; }
      const c = EG[hashIdx(qid + target, 6)]; return { kind: 'neutral', code: c, text: D.ev[c] };
    }
    if (risk.secondary.includes(target) && relatedCat) {
      const c = EA[hashIdx(qid + target, 4)]; return { kind: 'amber', code: c, text: D.ev[c] };
    }
    const c = EG[hashIdx(qid + target, 6)]; return { kind: 'neutral', code: c, text: D.ev[c] };
  }

  function rateControl(risk, cid) {
    if (risk.strong.includes(cid)) return 2;
    if (risk.partial.includes(cid)) return 1;
    return 0;
  }
  function applyControl(st, cid) {
    const delta = rateControl(st.risk, cid);
    const before = st.severity;
    st.severity = Math.max(0, st.severity - delta);
    return { delta, before, after: st.severity, label: delta === 2 ? 'Strong' : delta === 1 ? 'Partial' : 'No Match' };
  }

  const applicableHD = (risk) => risk.hd.slice();
  const applicableHM = (risk) => risk.hm.slice();

  function canGuess(st) { return !st.discovered && st.guessBlockedRound !== st.round; }
  function guess(st, owner, riskId) {
    const ownerOk = owner === st.risk.owner;
    const ok = ownerOk && riskId === st.risk.id;
    st.knowledge.guesses.push({ round: st.round, owner, risk: riskId, ownerOk, ok });
    if (ok) { st.discovered = true; st.discoveredRound = st.round; }
    else if (!ownerOk) st.guessBlockedRound = st.round + 1;
    return { ok, ownerOk };
  }

  // Phase J
  function tickClock(st) {
    if (st.severity > 0) st.clock -= 1;
    if (st.severity === 0 || st.clock <= 0) finish(st); else st.round += 1;
  }
  function finish(st) {
    st.over = true;
    if (st.severity === 0 && st.discovered) st.outcome = 'full';
    else if (st.severity === 0) st.outcome = 'itwin';
    else if (st.discovered) st.outcome = 'detect';
    else st.outcome = 'incident';
  }

  /* ---------------- Built-in bots ----------------
     GRC bot: Bayesian-ish elimination using the evidence it has seen.
     It uses the facilitator key only to interpret evidence (stand-in for a human reading
     the question + evidence semantically). It never sees the drawn risk directly. */
  function grcBelief(k) {
    const w = {}; D.risks.forEach((r) => (w[r.id] = 1));
    for (const e of k.evidence) {
      const cat = catOf(e.qid);
      for (const r of D.risks) {
        const isDirect = r.owner === e.target && r.directq.includes(e.qid);
        const isAmber = r.qcats.includes(cat) && ((r.owner === e.target && !r.directq.includes(e.qid)) || (r.owner !== e.target && r.secondary.includes(e.target)));
        const fits = e.kind === 'direct' ? isDirect : e.kind === 'amber' ? isAmber : (!isDirect && !isAmber);
        w[r.id] *= fits ? 1 : (e.kind === 'direct' ? 0.001 : 0.08);
      }
    }
    for (const h of k.hints) {
      if (!h.startsWith('HD')) continue;
      for (const r of D.risks) if (r.hd.includes(h)) w[r.id] *= 1.6;
    }
    for (const g of k.guesses) {
      if (!g.ok) w[g.risk] *= 0.01;
      if (!g.ownerOk) D.risks.filter((r) => r.owner === g.owner).forEach((r) => (w[r.id] *= 0.3));
    }
    const s = Object.values(w).reduce((a, b) => a + b, 0);
    Object.keys(w).forEach((id) => (w[id] /= s));
    return w;
  }
  function comb3(n) { return n < 3 ? 0 : (n * (n - 1) * (n - 2)) / 6; }
  function grcChoose(k) {
    const w = grcBelief(k);
    const ownerP = {}; D.it.forEach((f) => (ownerP[f.id] = 0));
    D.risks.forEach((r) => (ownerP[r.owner] += w[r.id]));
    // sharpen and sample the target
    const ids = Object.keys(ownerP); const sw = ids.map((id) => Math.pow(ownerP[id], 2) + 1e-6);
    let x = Math.random() * sw.reduce((a, b) => a + b, 0), target = ids[0];
    for (let i = 0; i < ids.length; i++) { x -= sw[i]; if (x <= 0) { target = ids[i]; break; } }
    let best = null;
    for (const cat of Object.keys(D.q)) {
      let sc = 0;
      for (const r of D.risks) {
        if (r.owner !== target) continue;
        const kd = r.directq.filter((q) => catOf(q) === cat).length;
        sc += w[r.id] * (1 - comb3(6 - kd) / comb3(6));
      }
      sc += Math.random() * 1e-4;
      if (!best || sc > best.sc) best = { cat, sc };
    }
    return { target, cat: best.cat, belief: w };
  }
  function grcDeclare(st) {
    if (!canGuess(st)) return { declare: false };
    const w = grcBelief(st.knowledge);
    const top = Object.entries(w).sort((a, b) => b[1] - a[1])[0];
    const hasDirect = st.knowledge.evidence.some((e) => e.kind === 'direct');
    const lastChance = st.clock === 1 || st.severity === 0;
    if ((top[1] >= 0.55 && hasDirect) || (lastChance && top[1] >= 0.2)) {
      return { declare: true, owner: riskById(top[0]).owner, risk: top[0], p: top[1] };
    }
    return { declare: false, p: top[1] };
  }
  function grcWantsDeepDive(st) {
    return st.tokens.deepDive && st.round >= 2 && !st.knowledge.evidence.some((e) => e.kind === 'direct');
  }

  // IT bot: knows the risk story, not the facilitator key. It favours pools that fit the story.
  function itChoosePool(risk) {
    const r = Math.random();
    if (r < 0.55) return risk.pools[0];
    if (r < 0.8 && risk.pools[1]) return risk.pools[1];
    if (r < 0.9 && risk.pools[2]) return risk.pools[2];
    return pick(Object.keys(D.c));
  }
  function itPick(risk, cids) {
    const rated = cids.map((id) => ({ id, v: rateControl(risk, id) }));
    const best = rated.slice().sort((a, b) => b.v - a.v)[0];
    if (rated.every((x) => x.v === best.v)) return pick(cids);
    return Math.random() < 0.85 ? best.id : pick(cids);
  }
  function itWantsRedraw(st, cids) { return st.tokens.redraw && cids.every((id) => rateControl(st.risk, id) === 0); }

  function ceoPick(list, used) {
    const fresh = list.filter((h) => !used.includes(h));
    return pick(fresh.length ? fresh : list);
  }

  return {
    init, newGame, drawQuestions, drawControls, evidenceFor, rateControl, applyControl,
    applicableHD, applicableHM, canGuess, guess, tickClock, finish, riskById, catOf,
    bots: { grcBelief, grcChoose, grcDeclare, grcWantsDeepDive, itChoosePool, itPick, itWantsRedraw, ceoPick },
    get data() { return D; },
  };
})();
if (typeof module !== 'undefined') module.exports = Engine;

</script>
<script>
/* =====================================================================
   Cyber GRC Risk Game · multiplayer table
   Architecture: one HOST tab opens a room with a 5-letter code and runs the game engine
   and every AI seat. Players join with the code over WebRTC (PeerJS free signaling/relay),
   send their moves to the host, and receive the full table state after every change.
   ===================================================================== */
const D = JSON.parse(document.getElementById('gameData').textContent);
Engine.init(D);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const clone = (o) => JSON.parse(JSON.stringify(o));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const icons = () => { try { window.lucide && lucide.createIcons({ attrs: { 'stroke-width': 1.75 } }); } catch {} };
const I = (n) => `<i data-lucide="${n}"></i>`;

const SEATS = [
  ...D.grc.map((g) => ({ id: g.id, team: 'grc', name: g.name.replace(/\s*[(\u2013-]\s*اختياري\)?/, '').trim() })),
  ...D.it.map((f) => ({ id: f.id, team: 'it', name: f.name })),
  { id: 'CEO', team: 'ceo', name: 'CEO' },
];
const seatOf = (id) => SEATS.find((s) => s.id === id);
const teamOf = (id) => (id.startsWith('GRC') ? 'grc' : id.startsWith('IT') ? 'it' : 'ceo');

  if (p.step === 'IT_POOL') { on('[data-p]', (b) => { d.pool = b.dataset.p; rer(); }); on('[data-use]', () => { d.pool = secret().itSug; rer(); }); on('[data-go]', () => sendAct({ pool: d.pool })); }
  if (p.step === 'IT_PICK') {
    on('[data-k]', (b) => { if (d.redraw) { sendAct({ redraw: b.dataset.k }); d.redraw = false; } else { d.pick = b.dataset.k; rer(); } });
    on('[data-redraw]', () => { d.redraw = !d.redraw; d.pick = null; rer(); }); on('[data-go]', () => sendAct({ apply: d.pick }));
  }
  if (p.step === 'DECLARE') {
    const o = $('[data-o]', M), r = $('[data-r]', M);
    if (o) o.onchange = () => { d.owner = o.value; rer(); }; if (r) r.onchange = () => { d.risk = r.value; rer(); };
    on('[data-use]', () => { d.owner = p.sug.owner; d.risk = p.sug.risk; rer(); });
    on('[data-skip]', () => sendAct({ declare: false })); on('[data-go]', () => sendAct({ declare: true, owner: d.owner, risk: d.risk }));
  }
}

function renderEnd(M) {
  const g = ST.game; const [en, ar, sub] = OUTCOME[g.outcome]; const rv = g.reveal || {}; const col = { direct: 'var(--direct)', amber: 'var(--amber)', neutral: 'var(--neutral)' };
  M.innerHTML = `<div class="end enter"><div class="lobby"><div><div class="en">${en}</div><h1>${ar}</h1><p style="color:var(--ink-2);max-width:48ch">${sub}</p>
      ${HOST.active ? `<div class="bar" style="border:0;padding:0"><button class="btn btn-primary" id="bAgain">${I('rotate-ccw')} لعبة جديدة بنفس المقاعد</button><button class="btn btn-line" id="bLobby">${I('armchair')} رجوع للطاولة</button></div>` : '<p class="note">الـHost بيبدأ اللعبة الجاية.</p>'}</div>
    <div>${rv.riskId ? riskCard(rv.riskId, true) : ''}</div></div>
    <div class="card" style="margin-top:26px"><h3>شريط الجولات</h3>${g.records.map((r) => { const s = (rv.rec || {})[r.round] || {}; return `<div class="tl"><span class="r">Round ${r.round}</span>
      <div>${r.grc ? `GRC <b class="mono">${r.grc.target}</b> · <b class="mono">${r.grc.cat}</b> ${r.grc.qs.map((q) => `<i class="sw" style="background:${col[q.kind]}" title="${q.id}"></i>`).join(' ')}` : 'GRC: مؤكد مسبقاً'}${r.guess ? `<br>إعلان <span class="mono">${r.guess.owner}+${r.guess.risk}</span> ${r.guess.ok ? 'صح' : 'غلط'}` : ''}</div>
      <div>${r.it ? `IT <span class="mono">${s.pool || ''} · ${s.applied || ''}</span> ${r.it.label} <span class="mono">${r.it.before}→${r.it.after}</span>` : ''}</div><span class="mono">Clock ${r.clock ?? ''}</span></div>`; }).join('')}</div>
    <div class="card"><h3>Debrief</h3><ol style="margin:0;padding-inline-start:1.2em"><li>ما أول Evidence غيّر اتجاه GRC؟</li><li>هل اختار GRC Category صحيحة؟</li><li>هل اختار IT Control يعالج Root Cause أم عرضاً؟</li><li>هل الحظ أم القرار الاستراتيجي أثّر أكثر؟</li><li>ما Evidence إضافي كان سيطلبه Audit/Risk في الواقع؟</li><li>ما الإجراء الذي يمنع تكرار الخطر؟</li></ol></div></div>`;
  if ($('#bAgain')) $('#bAgain').onclick = () => startGame();
  if ($('#bLobby')) $('#bLobby').onclick = () => toLobby();
}
function openRules() {
  $('#modal').innerHTML = `<div class="modal" id="mm"><div class="box"><div style="display:flex;align-items:center"><h2 style="margin:0">القواعد القياسية</h2><button class="icon-btn" style="margin-inline-start:auto" id="mc">${I('x')}</button></div>
    <p>يُسحب Risk عشوائي مرتبط بوظيفة IT (الـOwner). IT والـCEO بيعرفوه، GRC لأ. Severity تبدأ 4 والـAttack Clock يبدأ 4.</p>
    <table><tr><td class="mono">A·B</td><td>GRC يختار وظيفة IT وفئة أسئلة.</td></tr><tr><td class="mono">C</td><td>3 أسئلة عشوائية تُقرأ حرفياً. Deep Dive مرة وحدة: سؤال رابع.</td></tr>
    <tr><td class="mono">D</td><td>Evidence لكل سؤال: Direct (الشخص والسؤال صح) / Amber (قريب) / Neutral.</td></tr><tr><td class="mono">E</td><td>الـCEO يعطي GRC تلميح Discovery من القائمة.</td></tr>
    <tr><td class="mono">F·G</td><td>IT يختار Pool، يسحب 2 ويطبق 1: Strong -2، Partial -1، No Match 0. Emergency Re-Draw مرة وحدة.</td></tr><tr><td class="mono">H</td><td>الـCEO يعطي IT تلميح Mitigation.</td></tr>
    <tr><td class="mono">I</td><td>GRC ممكن يعلن Owner + Risk. Owner غلط = ممنوع الإعلان الجولة الجاية.</td></tr><tr><td class="mono">J</td><td>إذا Severity أكبر من صفر، الساعة تنزل 1.</td></tr></table>
    <h3>النتائج</h3><table><tr><td>Full Organizational Win</td><td>Severity صفر + GRC اكتشف</td></tr><tr><td>IT Mitigation Win</td><td>Severity صفر فقط</td></tr><tr><td>Detection Only</td><td>GRC اكتشف والوقت خلص</td></tr><tr><td>Cyber Incident</td><td>الوقت خلص بدون معالجة أو اكتشاف</td></tr></table></div></div>`;
  $('#mc').onclick = () => ($('#modal').innerHTML = ''); $('#mm').onclick = (e) => { if (e.target.id === 'mm') $('#modal').innerHTML = ''; }; icons();
}

/* timers re-render (countdown) and host watchdog */
setInterval(() => { if (ST && ST.phase === 'play' && ST.game.pending && ST.game.pending.timerMs) { const f = document.activeElement; if (!f || f.tagName !== 'SELECT') render(); } }, 1000);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { UI.panel = null; renderPanels(); renderTop(); $('#modal').innerHTML = ''; } });

(function boot() {
  const code = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  const hosting = LS.get('cgrc-hosting', null);
  if (code && hosting === code && NET.me.nick) { createRoom(code, true); return render(); }   // host reloaded: reopen the same room
  if (code && NET.me.nick && code.length === 5) { joinRoom(code); return; }                      // returning player
  render();
})();
</script>
</body>
